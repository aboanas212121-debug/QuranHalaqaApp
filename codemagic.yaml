workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: linux
    environment:
      groups: []
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
